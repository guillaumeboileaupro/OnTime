<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecran virtuel</title>
<style>
  :root {
    --fond: #1d1f23;
    --panneau: #272a30;
    --texte: #e6e6e6;
    --discret: #9aa0a6;
    --accent: #2bb3a3;
    --papier: #f2f0e9;
    --encre: #1b1b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    background: var(--panneau);
  }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.secondaire { background: #3a3f47; }
  #etat { color: var(--discret); margin-left: auto; }
  main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px;
    min-height: 0;
  }
  .ecran {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cadre {
    background: #101113;
    padding: 18px;
    border-radius: 10px;
  }
  canvas {
    display: block;
    width: 800px;
    max-width: 100%;
    image-rendering: pixelated;
    background: var(--papier);
  }
  #rafraichi { color: var(--discret); font-size: 12px; }
  pre {
    flex: 1;
    margin: 0;
    padding: 10px;
    background: #111214;
    border-radius: 10px;
    overflow: auto;
    font: 12px/1.45 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-all;
    min-width: 280px;
  }
  @media (max-width: 1100px) {
    main { flex-direction: column; }
    pre { min-height: 200px; }
  }
</style>
</head>
<body>
<header>
  <h1>Ecran virtuel ESP32</h1>
  <button id="connecter">Connecter l'ESP32</button>
  <button id="deconnecter" class="secondaire" disabled>Deconnecter</button>
  <button id="reset" class="secondaire" disabled>Redemarrer l'ESP32</button>
  <button id="png" class="secondaire" disabled>Enregistrer PNG</button>
  <span id="etat">Non connecte</span>
</header>
<main>
  <div class="ecran">
    <div class="cadre"><canvas id="canvas" width="400" height="300"></canvas></div>
    <span id="rafraichi">En attente d'une image...</span>
  </div>
  <pre id="journal"></pre>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const journal = document.getElementById('journal');
const etat = document.getElementById('etat');
const PAPIER = [0xf2, 0xf0, 0xe9];
const ENCRE = [0x1b, 0x1b, 0x1b];
let port;

if (!('serial' in navigator)) {
  etat.textContent = 'Web Serial indisponible : ouvrir cette page dans Chrome ou Edge';
  document.getElementById('connecter').disabled = true;
}

function ecrireJournal(ligne) {
  const enBas = journal.scrollTop + journal.clientHeight >= journal.scrollHeight - 4;
  journal.append(ligne + '\n');
  while (journal.childNodes.length > 3000) journal.firstChild.remove();
  if (enBas) journal.scrollTop = journal.scrollHeight;
}

// "@ECRAN 400 300 <base64>" : 1 bit par pixel, ligne par ligne, bit de poids fort a gauche, 1 = blanc
function dessiner(ligne) {
  const [, l, h, b64] = ligne.trim().split(' ');
  const largeur = +l, hauteur = +h;
  let octets;
  try { octets = Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
  catch { ecrireJournal('[ecran virtuel] image incomplete, ignoree'); return; }
  const pas = Math.ceil(largeur / 8);
  if (octets.length < pas * hauteur) { ecrireJournal('[ecran virtuel] image incomplete, ignoree'); return; }

  canvas.width = largeur;
  canvas.height = hauteur;
  const img = ctx.createImageData(largeur, hauteur);
  for (let y = 0; y < hauteur; y++) {
    for (let x = 0; x < largeur; x++) {
      const blanc = (octets[y * pas + (x >> 3)] >> (7 - (x & 7))) & 1;
      const c = blanc ? PAPIER : ENCRE;
      const i = (y * largeur + x) * 4;
      img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('rafraichi').textContent = 'Rafraichi a ' + new Date().toLocaleTimeString();
  ecrireJournal('[ecran virtuel] nouvelle image ' + largeur + 'x' + hauteur);
}

function traiter(ligne) {
  const i = ligne.indexOf('@ECRAN ');
  if (i < 0) return ecrireJournal(ligne);
  if (i > 0) ecrireJournal(ligne.slice(0, i));
  dessiner(ligne.slice(i));
}

let lecteur, flux;

async function lire() {
  const decodeur = new TextDecoderStream();
  flux = port.readable.pipeTo(decodeur.writable).catch(() => {});
  lecteur = decodeur.readable.getReader();
  let reste = '';
  try {
    while (true) {
      const { value, done } = await lecteur.read();
      if (done) break;
      reste += value;
      const lignes = reste.split('\n');
      reste = lignes.pop();
      for (const l of lignes) traiter(l.replace(/\r$/, ''));
    }
  } catch (e) {
    ecrireJournal('[ecran virtuel] lecture interrompue : ' + e.message);
  }
  etat.textContent = 'Deconnecte';
  document.getElementById('reset').disabled = true;
  document.getElementById('deconnecter').disabled = true;
  document.getElementById('connecter').disabled = false;
}

// Libere le port, par exemple pour televerser depuis l'IDE Arduino
document.getElementById('deconnecter').onclick = async () => {
  await lecteur.cancel();
  await flux;
  await port.close();
  ecrireJournal('[ecran virtuel] port libere');
};

document.getElementById('connecter').onclick = async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) {
    etat.textContent = 'Echec : ' + e.message + ' (moniteur serie de l\'IDE ferme ?)';
    return;
  }
  etat.textContent = 'Connecte';
  document.getElementById('reset').disabled = false;
  document.getElementById('deconnecter').disabled = false;
  document.getElementById('connecter').disabled = true;
  lire();
};

// Sur les cartes ESP32, RTS commande EN (reset) et DTR commande IO0 (mode flash)
document.getElementById('reset').onclick = async () => {
  await port.setSignals({ dataTerminalReady: false, requestToSend: true });
  await new Promise(r => setTimeout(r, 100));
  await port.setSignals({ requestToSend: false });
  ecrireJournal('[ecran virtuel] redemarrage demande');
};

document.getElementById('png').onclick = () => {
  const a = document.createElement('a');
  a.download = 'ecran.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};
new MutationObserver(() => document.getElementById('png').disabled = false)
  .observe(document.getElementById('rafraichi'), { childList: true });
</script>
</body>
</html>
