name: C++ domain

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Portable domain tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check test launcher syntax
        run: sh -n tests/run_cpp_tests.sh
      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$PR_HEAD_SHA"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi
      - name: Run portable C++ tests
        run: tests/run_cpp_tests.sh

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build sanitizer test binary
        run: >-
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic
          -fsanitize=address,undefined -fno-omit-frame-pointer
          tests/departure_policy_test.cpp -o /tmp/ontime-departure-policy-sanitized
      # LeakSanitizer is disabled to match supervised local runs; address and
      # undefined-behavior checks remain fatal and run in a distinct job.
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/ontime-departure-policy-sanitized
